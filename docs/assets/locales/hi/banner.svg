<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none" role="img" aria-label="GitHub Organization Map &amp; Cartography Banner">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="title-cyan" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left Glowing Circuit Decoration -->
  <g transform="translate(60, 65)">
    <!-- Outer Aura Rings -->
    <circle cx="90" cy="125" r="95" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 6"/>
    <circle cx="90" cy="125" r="75" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.25"/>
    <circle cx="90" cy="125" r="55" fill="#0f172a" stroke="#1e293b" stroke-width="1.8"/>

    <!-- Map & Topology Cartography Emblem -->
    <g transform="translate(90, 125)">
      <!-- Central Hub -->
      <circle cx="0" cy="0" r="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#badge-glow)"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>

      <!-- Node 1: Top Right (Public) -->
      <line x1="0" y1="0" x2="32" y2="-32" stroke="#34d399" stroke-width="2" stroke-dasharray="3 2"/>
      <circle cx="32" cy="-32" r="9" fill="#064e3b" stroke="#34d399" stroke-width="1.8"/>
      <circle cx="32" cy="-32" r="3.5" fill="#34d399"/>

      <!-- Node 2: Bottom Right (Masked Private) -->
      <line x1="0" y1="0" x2="34" y2="28" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 2"/>
      <circle cx="34" cy="28" r="9" fill="#4c0519" stroke="#f43f5e" stroke-width="1.8"/>
      <!-- Lock Shackle Icon in Node 2 -->
      <rect x="31" y="26" width="6" height="5" rx="1" fill="#f43f5e"/>
      <path d="M 32 26 L 32 23 C 32 21.5 36 21.5 36 23 L 36 26" fill="none" stroke="#f43f5e" stroke-width="1"/>

      <!-- Node 3: Left (Masked Private) -->
      <line x1="0" y1="0" x2="-35" y2="8" stroke="#c084fc" stroke-width="2" stroke-dasharray="3 2"/>
      <circle cx="-35" cy="8" r="8" fill="#2e1065" stroke="#c084fc" stroke-width="1.8"/>
      <circle cx="-35" cy="8" r="3" fill="#c084fc"/>
    </g>

    <!-- Subtitle under Emblem -->
    <text x="90" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">मानचित्रण इंजन</text>
  </g>

  <!-- Right Content Area -->
  <g transform="translate(300, 60)">
    <!-- Top System Badges -->
    <g transform="translate(0, 0)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="168" height="26" rx="6" fill="#131c2e" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="12" cy="13" r="3.5" fill="#38bdf8" filter="url(#badge-glow)"/>
      <text x="24" y="17" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">KS-GG-AI पारिस्थितिकी तंत्र</text>

      <!-- Badge 2 -->
      <rect x="180" y="0" width="195" height="26" rx="6" fill="#1e1329" stroke="#4c1d95" stroke-width="1"/>
      <circle cx="192" cy="13" r="3.5" fill="#c084fc" filter="url(#badge-glow)"/>
      <text x="204" y="17" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">शून्य-ज्ञान मास्किंग</text>

      <!-- Badge 3 -->
      <rect x="387" y="0" width="165" height="26" rx="6" fill="#0f231d" stroke="#065f46" stroke-width="1"/>
      <circle cx="399" cy="13" r="3.5" fill="#34d399" filter="url(#badge-glow)"/>
      <text x="411" y="17" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">दैनिक स्वचालित क्रॉन</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="74" fill="url(#title-cyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      GitHub संगठन मानचित्र और टोपोलॉजी
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500">
      साल्टेड SHA-256 गोपनीयता संरक्षण के साथ स्वचालित दैनिक रिपॉजिटरी मानचित्रण
    </text>

    <!-- 5 Technology & Feature Chips -->
    <g transform="translate(0, 140)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="154" height="28" rx="6" fill="#0d1527" stroke="#1d2f4d" stroke-width="1"/>
      <text x="12" y="18" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">दैनिक क्रॉन ताज़ा</text>

      <!-- Chip 2 -->
      <rect x="164" y="0" width="164" height="28" rx="6" fill="#0d1527" stroke="#1d2f4d" stroke-width="1"/>
      <text x="176" y="18" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">दोहरे दायरे वाले टोकन</text>

      <!-- Chip 3 -->
      <rect x="338" y="0" width="144" height="28" rx="6" fill="#0d1527" stroke="#1d2f4d" stroke-width="1"/>
      <text x="350" y="18" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">TypeScript और tsx</text>

      <!-- Chip 4 -->
      <rect x="492" y="0" width="156" height="28" rx="6" fill="#0d1527" stroke="#1d2f4d" stroke-width="1"/>
      <text x="504" y="18" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">SVG और एनिमेटेड GIF</text>

      <!-- Chip 5 -->
      <rect x="658" y="0" width="150" height="28" rx="6" fill="#0d1527" stroke="#1d2f4d" stroke-width="1"/>
      <text x="670" y="18" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">10 भाषाओं में समानता</text>
    </g>

    <!-- Bottom Architectural Security Spec Line -->
    <g transform="translate(0, 198)">
      <line x1="0" y1="0" x2="810" y2="0" stroke="#1e293b" stroke-width="1"/>
      <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        गोपनीयता मॉडल: साल्टेड SHA-256 हैश · सुरक्षित पृथक्करण · न्यूनतम विशेषाधिकार पाइपलाइन
      </text>
    </g>
  </g>
</svg>
